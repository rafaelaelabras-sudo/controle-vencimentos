name: Build Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-vencimentos-project.zip'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -q native-vencimentos-project.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Build debug APK
        run: |
          cd native-vencimentos
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: controle-vencimentos-debug-apk
          path: native-vencimentos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
