name: Build Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-vencimentos-project.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          unzip -q native-vencimentos-project.zip -d .
          sed -i "s/applicationId 'br.com.rafaela.vencimentos'/applicationId 'br.com.rafaela.vencimentos.teste20261107'/" native-vencimentos/app/build.gradle
          grep "applicationId 'br.com.rafaela.vencimentos.teste20261107'" native-vencimentos/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Build debug APK
        run: |
          cd native-vencimentos
          gradle --no-daemon assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: controle-vencimentos-debug-apk-v2
          path: native-vencimentos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native-vencimentos/app/build/outputs/apk/debug/app-debug.apk Controle-de-Vencimentos-teste-v2.apk
          gh release create teste-v2 Controle-de-Vencimentos-teste-v2.apk --title 'Controle de Vencimentos — teste Android v2' --notes 'Versão experimental com identificador separado. Verifique instalação e notificações antes de depender delas.' --prerelease || gh release upload teste-v2 Controle-de-Vencimentos-teste-v2.apk --clobber
