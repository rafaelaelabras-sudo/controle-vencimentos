name: Build Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-vencimentos-project.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -q native-vencimentos-project.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Build debug APK
        run: |
          cd native-vencimentos
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: controle-vencimentos-debug-apk
          path: native-vencimentos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native-vencimentos/app/build/outputs/apk/debug/app-debug.apk Controle-de-Vencimentos-teste.apk
          gh release create teste-v1 Controle-de-Vencimentos-teste.apk --title 'Controle de Vencimentos — teste Android' --notes 'Versão experimental para testar notificações no Android; não é um lançamento final.' --prerelease || gh release upload teste-v1 Controle-de-Vencimentos-teste.apk --clobber
